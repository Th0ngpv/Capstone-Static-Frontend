<!doctype html>
<html lang="en">
  <head>
    <!-- Charset -->
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme -->
    <meta name="theme-color" content="#12A277" />

    <!-- SEO -->
    <title>WealthOS | AI-Driven Wealth & Portfolio Management Platform</title>

    <meta
      name="description"
      content="WealthOS is an AI-driven wealth and portfolio management platform that helps users track cash flow, manage investments, monitor debt, and receive personalized financial guidance."
    />

    <meta
      name="keywords"
      content="wealth management, portfolio tracker, AI finance platform, fintech dashboard, investment tracking, budgeting app, Vietnamese fintech, personal finance"
    />

    <meta name="author" content="Pham Viet Thong" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="WealthOS | AI-Driven Wealth Platform" />

    <meta
      property="og:description"
      content="Track portfolios, monitor cash flow, manage debt, and receive AI-powered financial guidance in one platform."
    />

    <meta property="og:image" content="/preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="WealthOS | AI-Driven Wealth Platform" />

    <meta
      name="twitter:description"
      content="Modern AI-powered wealth management platform for retail investors."
    />

    <meta name="twitter:image" content="/preview.png" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="apple-mobile-web-app-title" content="WealthOS" />

    <!-- Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <!-- Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
